[Mod]
Id = Preymonition
Name = Preymonition
Version = 0.1.1
Description = Repeats the current attacker's directional cue at the bottom center of the HUD.

[Setting.Enabled]
Id = Enabled
Type = toggle
Label = Enable Preymonition
Description = Show the bottom-center directional attack cue during combat.
