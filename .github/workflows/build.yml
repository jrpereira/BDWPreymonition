name: Build and test
on:
  push:
    branches: ['**', '!release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      modcore-templates:
        description: ModCoreTemplates to test against, main or declared (the release mod.json requires)
        type: string
        default: main
permissions:
  contents: read
jobs:
  repository-hygiene:
    uses: ./.github/workflows/repository-hygiene.yml
  lua:
    runs-on: ubuntu-latest
    steps:
      # The Lua tests run from a workspace root holding this module beside
      # ModCoreTemplates, whose Scripts the templates load.
      - uses: actions/checkout@v4
        with:
          path: Preymonition
      # Builds test against ModCoreTemplates' main; a release against the version its
      # mod.json requires, each placeholder ? taken as 0 as packaging does.
      - name: Choose the ModCoreTemplates version
        id: templates
        env:
          WANTED: ${{ inputs.modcore-templates || 'main' }}
        run: |
          if [ "$WANTED" = declared ]; then
            version=$(python3 -c "import json; print(next(d['version'] for d in json.load(open('Preymonition/mod.json'))['dependencies'] if d['id']=='ModCoreTemplates'))")
            version="${version%+}"
            echo "ref=v${version//\?/0}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$WANTED" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: jrpereira/ModCoreTemplates
          ref: ${{ steps.templates.outputs.ref }}
          path: ModCoreTemplates
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Compile Lua and run mock tests
        run: |
          find Preymonition/Scripts Preymonition/tests -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
          for test in Preymonition/tests/*_test.lua; do lua5.4 "$test"; done
      - name: Check the settings reference
        # docs/SETTINGS.md and MOD_SETTINGS.txt come from ModCoreTemplates' generator.
        run: lua5.4 ModCoreTemplates/tools/settings_reference.lua Preymonition --check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release packaging
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build archive and checksum
        run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: mod-package
          path: dist/*
          if-no-files-found: error
  lua-and-package:
    needs: [lua, package]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Lua and package checks
        run: echo "Lua and package checks passed"
